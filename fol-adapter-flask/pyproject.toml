[project]
name = "fol-adapter-flask"
version = "0.1.0"
description = ""
authors = [{ name = "Genadij Razdorov", email = "genadijrazdorov@gmail.com" }]
readme = "README.md"
requires-python = "~= 3.14.0"
dependencies = [
  "flask (>=3.1.3,<4.0.0)",
  "gunicorn (>=26.2.0,<27.0.0)",
  "fol-core",
]

[tool.poetry]
packages = [{ include = "flask_on_lambda", from = "src" }]

[tool.poetry.dependencies]
fol-core = { develop = true, path = "./fol-core/" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = ["pytest (>=9.1.1,<10.0.0)"]
