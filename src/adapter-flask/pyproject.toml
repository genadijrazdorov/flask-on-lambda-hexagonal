[project]
name = "flask-on-lambda-adapter-flask"
version = "0.1.0"
description = ""
authors = [{ name = "Genadij Razdorov", email = "genadijrazdorov@gmail.com" }]
readme = "README.md"
requires-python = "~= 3.14.0"
dependencies = ["flask (>=3.1.3,<4.0.0)"]

[tool.poetry]
packages = [{ include = "flask_on_lambda", from = "src" }]

