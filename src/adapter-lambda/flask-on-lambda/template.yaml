AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  python3.14

  Sample SAM Template for flask-on-lambda

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:
  FlaskOnLambdaFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Environment:
        Variables:
          AWS_LWA_PORT: "8000"
      Events:
        APIEvent:
          Type: HttpApi # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./app
      DockerTag: python3.14-v1

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  FlaskOnLambdaAPI:
    Description: "API Gateway endpoint URL for Prod stage for Flask on Lambda function"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URL\
      Suffix}/Prod/"
  FlaskOnLambdaFunction:
    Description: "Flask on Lambda Function ARN"
    Value: !GetAtt FlaskOnLambdaFunction.Arn
  FlaskOnLambdaFunctionIamRole:
    Description: "Implicit IAM Role created for Flask-on-Lambda function"
    Value: !GetAtt FlaskOnLambdaFunctionRole.Arn
