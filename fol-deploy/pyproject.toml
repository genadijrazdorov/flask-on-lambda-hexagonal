[project]
name = "fol-deploy"
version = "0.1.0"
description = ""
authors = [{ name = "Genadij Razdorov", email = "genadijrazdorov@gmail.com" }]
requires-python = "~= 3.14.0"
dependencies = ["fol-core==0.1.0", "fol-adapter-flask==0.1.0"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
fol-core = { develop = true, path = "../fol-core" }
fol-adapter-flask = { develop = true, path = "../fol-adapter-flask" }

[dependency-groups]
dev = ["aws-sam-cli (>=1.169.0,<2.0.0)"]
